# ===================================================================
# Configuracion del Microservicio Spring Boot - Master Martini
# ===================================================================

# 1. Puerto del Servidor Web (Coincide con http://10.0.2.2:8080 en el emulador Android)
server.port=8080

# 2. Configuracion de H2 Database Persistente en Archivo Local
# Los datos se guardan en el archivo local ./data/martinidb para evitar perdidas al reiniciar el servidor.
spring.datasource.url=jdbc:h2:file:./data/martinidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Habilitacion de la Consola Web de H2 (Acceso via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 4. Configuracion de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
